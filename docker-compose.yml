name: akilas-archive

services:
  app:
    build: ./app
    image: akilas-archive-app
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/data
    volumes:
      - ./data:/data
    networks:
      - frontend
    mem_limit: 280m
    # Optional direct access for debugging (loopback only, never public):
    # ports:
    #   - "127.0.0.1:8081:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    depends_on:
      - app
    mem_limit: 96m

volumes:
  caddy_data:
  caddy_config:

networks:
  frontend:
